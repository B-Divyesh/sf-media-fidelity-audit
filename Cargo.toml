[package]
name = "media-fidelity-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only proof that archived media preserves source bytes and key metadata"
license = "MIT"
readme = "README.md"
homepage = "https://media-fidelity-audit.sociobot.in"
repository = "https://github.com/B-Divyesh/sf-media-fidelity-audit"
keywords = ["backup", "photos", "archive", "fidelity"]
categories = ["command-line-utilities", "multimedia"]
include = ["/src/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "mfa"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.31", features = ["derive"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"

[dev-dependencies]
tempfile = "3.16.0"
